name: Linux Release

# Builds the x86_64 Flatpak on a GitHub-hosted runner and uploads it to the
# public qiudaomao/clipboardSyncRelease repo, where push.sh picks it up for the
# self-hosted download mirror. Build the aarch64 bundle on a native ARM host
# with `./build-linux-flatpak.sh aarch64 -u v<version>`: QEMU on a hosted x86
# runner cannot create the user namespace required by Flatpak's bwrap sandbox.
#
# Required secret: RELEASE_TOKEN — a PAT with "contents: write" on
# qiudaomao/clipboardSyncRelease (the default GITHUB_TOKEN cannot upload to
# another repository).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "clipboardSyncRelease tag to upload the bundles to (e.g. v0.1.19)"
        required: true

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Flatpak bundle
        run: ./build-linux-flatpak.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-sync-linux-x86_64
          path: artifacts/linux/clipboardSyncLinux-x86_64.flatpak
          if-no-files-found: error

  publish:
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Upload to clipboardSyncRelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          tag="${{ github.event.inputs.release_tag || github.ref_name }}"
          find bundles -name '*.flatpak' -print
          gh release view "$tag" --repo qiudaomao/clipboardSyncRelease >/dev/null \
            || gh release create "$tag" --repo qiudaomao/clipboardSyncRelease --title "$tag" --notes "Linux flatpak bundles for $tag"
          find bundles -name '*.flatpak' -exec \
            gh release upload "$tag" {} --repo qiudaomao/clipboardSyncRelease --clobber \;
